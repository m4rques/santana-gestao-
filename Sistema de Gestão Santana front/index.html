<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar - Sant'Ana</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">Ir para o conteúdo</a>
<main id="main" class="login">
  <div class="card">
    <h1>Sant'Ana – Entrar</h1>
    <form id="f" novalidate>
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="senha">Senha</label>
      <input id="senha" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
      <div id="m" class="msg" role="alert"></div>
    </form>
    <p id="dica">Teste (modo sem back-end): admin@santana.com / Admin@123</p>
  </div>
</main>
<script src="app.js"></script>
<script>
if (!CONFIG.USE_MOCK) $('#dica').hidden = true;
if (sessionStorage.token) location.href = 'veiculos.html';
$('#f').onsubmit = async e => {
  e.preventDefault();
  const email = $('#email').value.trim(), senha = $('#senha').value;
  if (!email || !senha) return msg($('#m'), 'Preencha e-mail e senha.');
  try {
    const r = await api('/login', 'POST', { email, senha });
    sessionStorage.token = r.token; sessionStorage.nome = r.nome; sessionStorage.perfil = r.perfil;
    location.href = 'veiculos.html';
  } catch (err) { msg($('#m'), err.message); }
};
</script>
</body>
</html>
