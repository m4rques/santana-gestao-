<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contrato - Sant'Ana</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">Ir para o conteúdo</a>
<header class="top" id="top"></header>
<main id="main">
  <h1 class="noprint">Contrato de venda</h1>
  <form id="f" class="card row noprint">
    <div><label for="id">Número da venda</label><input id="id" type="number" min="1" value="1" required></div>
    <button type="submit">Gerar contrato</button>
    <button type="button" class="sec" id="imp" hidden>Imprimir / Salvar PDF</button>
  </form>
  <div id="m" class="msg noprint" role="alert"></div>
  <article id="doc" class="contract" hidden></article>
</main>
<script src="app.js"></script>
<script>
shell('contrato.html');
const dt = s => new Date(s + 'T12:00:00').toLocaleDateString('pt-BR');
async function carregar(id) {
  $('#m').className = 'msg'; $('#m').textContent = '';
  try {
    const v = await api('/vendas/' + id);
    $('#doc').innerHTML = `<h2>Contrato de compra e venda de veículo nº ${esc(v.id)}</h2>
      <p><strong>Vendedora:</strong> Sant'Ana Concessionária.</p>
      <p><strong>Comprador(a):</strong> ${esc(v.cliente.nome)}, CPF/CNPJ ${esc(v.cliente.cpf)}, residente em ${esc(v.cliente.endereco)}.</p>
      <p><strong>Veículo:</strong> ${esc(v.veiculo.marca)} ${esc(v.veiculo.modelo)}, ano ${esc(v.veiculo.ano)}, chassi ${esc(v.veiculo.chassi)}.</p>
      <p><strong>Valor:</strong> ${brl(v.valor)}. <strong>Pagamento:</strong> ${esc(v.pagamento)}.</p>
      <p>As partes concordam com a venda do veículo acima descrito nas condições indicadas, na data de ${dt(v.data)}.</p>
      <div class="sig"><div>Sant'Ana Concessionária</div><div>${esc(v.cliente.nome)}</div></div>`;
    $('#doc').hidden = false; $('#imp').hidden = false; $('#doc').focus();
  } catch (err) { $('#doc').hidden = true; $('#imp').hidden = true; msg($('#m'), err.message); }
}
$('#f').onsubmit = e => { e.preventDefault(); carregar($('#id').value); };
$('#imp').onclick = () => print();
const p = new URLSearchParams(location.search).get('id');
if (p) { $('#id').value = p; carregar(p); }
</script>
</body>
</html>
