<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veículos - Sant'Ana</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">Ir para o conteúdo</a>
<header class="top" id="top"></header>
<main id="main">
  <h1>Veículos</h1>
  <form id="f" class="card filters" role="search" aria-label="Filtros de veículos">
    <div><label for="marca">Marca</label><input id="marca" autocomplete="off"></div>
    <div><label for="modelo">Modelo</label><input id="modelo" autocomplete="off"></div>
    <div><label for="preco">Preço máximo (R$)</label><input id="preco" type="number" min="0"></div>
    <div><label for="status">Status</label>
      <select id="status"><option value="">Todos</option><option>Disponível</option><option>Reservado</option><option>Vendido</option><option>Em Test-Drive</option><option>Em manutenção</option></select></div>
    <button type="submit">Buscar</button>
  </form>
  <p id="cont" role="status" aria-live="polite"></p>
  <section id="lista" class="grid" aria-label="Resultados"></section>
</main>
<script src="app.js"></script>
<script>
shell('veiculos.html');
async function buscar() {
  const q = new URLSearchParams();
  [['marca', 'marca'], ['modelo', 'modelo'], ['preco', 'precoMax'], ['status', 'status']].forEach(([id, k]) => { const v = $('#' + id).value.trim(); if (v) q.set(k, v); });
  try {
    const r = await api('/veiculos?' + q);
    $('#cont').textContent = r.length ? r.length + ' veículo(s) encontrado(s).' : 'Nenhum veículo encontrado. Tente remover algum filtro.';
    $('#lista').innerHTML = r.map(v => `<article class="card car">
      <img src="${esc(v.foto || IMG)}" alt="${esc(v.marca + ' ' + v.modelo + ' ' + v.ano)}" loading="lazy">
      <h2>${esc(v.marca)} ${esc(v.modelo)}</h2>
      <p>${esc(v.ano)} · ${esc(v.tipo)} · ${Number(v.km).toLocaleString('pt-BR')} km</p>
      <p><strong>${brl(v.preco)}</strong></p>
      <span class="badge s-${esc(v.status.split(' ')[0])}">${esc(v.status)}</span>
    </article>`).join('');
  } catch (err) { $('#cont').textContent = err.message; }
}
$('#f').onsubmit = e => { e.preventDefault(); buscar(); };
buscar();
</script>
</body>
</html>
